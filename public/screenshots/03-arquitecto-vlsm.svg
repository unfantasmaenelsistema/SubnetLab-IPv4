<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#020617"/>
  <rect x="0" y="0" width="1200" height="58" fill="#0f172a" stroke="#1e293b"/>
  <text x="40" y="35" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">SubnetLab IPv4 — Arquitecto VLSM, Mapa de Espacio y Simulador de Enrutamiento</text>

  <!-- Address Space Bar Card -->
  <rect x="32" y="78" width="1136" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="54" y="108" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Mapa de Ocupación del Espacio de Direccionamiento (192.168.10.0/24 — 97% asignado)</text>
  <text x="850" y="108" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">✓ Espacio VLSM Válido sin Solapamientos</text>

  <!-- Proportional Bar -->
  <rect x="54" y="125" width="540" height="36" rx="6" fill="#0284c7"/>
  <text x="324" y="148" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">VLAN 10 Ingeniería (/25 · 128 IPs)</text>
  <rect x="596" y="125" width="270" height="36" fill="#059669"/>
  <text x="731" y="148" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">VLAN 20 Ventas (/26 · 64 IPs)</text>
  <rect x="868" y="125" width="135" height="36" fill="#d97706"/>
  <text x="935" y="148" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DMZ (/27)</text>
  <rect x="1005" y="125" width="75" height="36" fill="#4f46e5"/>
  <text x="1042" y="148" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">/28</text>
  <rect x="1082" y="125" width="64" height="36" fill="#0f172a" stroke="#334155"/>

  <text x="54" y="188" fill="#94a3b8" font-family="sans-serif" font-size="12">■ Sede Central (100h → /25)   ■ Sucursal Norte (50h → /26)   ■ Servidores DMZ (25h → /27)   ■ Wi-Fi Invitados (12h → /28)   ■ WAN (/30)</text>

  <!-- VLSM Table -->
  <rect x="32" y="232" width="1136" height="275" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="54" y="264" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Tabla Maestra de Direccionamiento VLSM (Ordenada Mayor → Menor Demanda)</text>

  <text x="54" y="298" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">VLAN</text>
  <text x="140" y="298" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">Segmento / Rol</text>
  <text x="410" y="298" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">Hosts Req / Útiles</text>
  <text x="560" y="298" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">Prefijo / Máscara</text>
  <text x="740" y="298" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">IP de Red</text>
  <text x="890" y="298" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">Gateway — Último Host</text>
  <text x="1080" y="298" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">Broadcast</text>

  <line x1="54" y1="310" x2="1146" y2="310" stroke="#1e293b"/>

  <text x="54" y="338" fill="#94a3b8" font-family="monospace" font-size="13">VLAN 10</text>
  <text x="140" y="338" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Sede Central — Ingeniería</text>
  <text x="410" y="338" fill="#e2e8f0" font-family="monospace" font-size="13">100 / 126 (79%)</text>
  <text x="560" y="338" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">/25 (255.255.255.128)</text>
  <text x="740" y="338" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">192.168.10.0</text>
  <text x="890" y="338" fill="#34d399" font-family="monospace" font-size="13">192.168.10.1 — .126</text>
  <text x="1080" y="338" fill="#fbbf24" font-family="monospace" font-size="13">192.168.10.127</text>

  <text x="54" y="378" fill="#94a3b8" font-family="monospace" font-size="13">VLAN 20</text>
  <text x="140" y="378" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Sucursal Norte — Ventas</text>
  <text x="410" y="378" fill="#e2e8f0" font-family="monospace" font-size="13">50 / 62 (81%)</text>
  <text x="560" y="378" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">/26 (255.255.255.192)</text>
  <text x="740" y="378" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">192.168.10.128</text>
  <text x="890" y="378" fill="#34d399" font-family="monospace" font-size="13">192.168.10.129 — .190</text>
  <text x="1080" y="378" fill="#fbbf24" font-family="monospace" font-size="13">192.168.10.191</text>

  <text x="54" y="418" fill="#94a3b8" font-family="monospace" font-size="13">VLAN 30</text>
  <text x="140" y="418" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Servidores DMZ &amp; Firewall</text>
  <text x="410" y="418" fill="#e2e8f0" font-family="monospace" font-size="13">25 / 30 (83%)</text>
  <text x="560" y="418" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">/27 (255.255.255.224)</text>
  <text x="740" y="418" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">192.168.10.192</text>
  <text x="890" y="418" fill="#34d399" font-family="monospace" font-size="13">192.168.10.193 — .222</text>
  <text x="1080" y="418" fill="#fbbf24" font-family="monospace" font-size="13">192.168.10.223</text>

  <text x="54" y="458" fill="#94a3b8" font-family="monospace" font-size="13">VLAN 90</text>
  <text x="140" y="458" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Enlace WAN Router A–B</text>
  <text x="410" y="458" fill="#e2e8f0" font-family="monospace" font-size="13">2 / 2 (100%)</text>
  <text x="560" y="458" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">/30 (255.255.255.252)</text>
  <text x="740" y="458" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">192.168.10.240</text>
  <text x="890" y="458" fill="#34d399" font-family="monospace" font-size="13">192.168.10.241 — .242</text>
  <text x="1080" y="458" fill="#fbbf24" font-family="monospace" font-size="13">192.168.10.243</text>

  <!-- Packet Simulator Box -->
  <rect x="32" y="525" width="1136" height="122" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="54" y="555" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Simulador de Enrutamiento de Paquetes (Longest Prefix Match): VLAN 10 → 192.168.10.200</text>
  <text x="54" y="582" fill="#cbd5e1" font-family="monospace" font-size="12">→ 1. Origen en [VLAN 10 · 192.168.10.0/25]: El destino 192.168.10.200 no pertenece a la subred local. Se envía al Default Gateway 192.168.10.1.</text>
  <text x="54" y="606" fill="#34d399" font-family="monospace" font-size="12">→ 2. Lookup Tabla de Rutas (Longest Prefix Match): Coincidencia con ruta conectada 192.168.10.192/27 vía Gi0/0.30 (Servidores DMZ).</text>
  <text x="54" y="630" fill="#e2e8f0" font-family="monospace" font-size="12">→ 3. Entrega Capa 3 exitosa: El router decrementa TTL y encamina el paquete hacia la VLAN 30.</text>
</svg>
